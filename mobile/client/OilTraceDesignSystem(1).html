<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oil Trace - Glassmorphism UI Kit</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- Pinned Script tags for React and Babel with integrity hashes as required -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Tailwind CSS configurations mapping custom colors to theme variables -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandBg: 'var(--bg)',
            brandSurface: 'var(--surface)',
            brandFg: 'var(--foreground)',
            brandMuted: 'var(--muted)',
            brandBorder: 'var(--border)',
            brandAccent: 'var(--accent)',
            brandGold: 'var(--accent-secondary)',
            chartPrimary: 'var(--chart-primary)',
            chartPrimaryGlow: 'var(--chart-primary-glow)',
            chartSecondary: 'var(--chart-secondary)',
            chartSecondaryGlow: 'var(--chart-secondary-glow)',
            chartTertiary: 'var(--chart-tertiary)',
            chartTertiaryGlow: 'var(--chart-tertiary-glow)',
            chartBg: 'var(--chart-bg)',
            chartGrid: 'var(--chart-grid)',
            chartText: 'var(--chart-text)',
          },
          fontFamily: {
            display: ['Manrope', 'sans-serif'],
            body: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    /* Theme Specification definitions matching DESIGN.md */
    .theme-light {
      --bg: #fbf8fe;
      --surface: #ffffff;
      --foreground: #09090b;
      --muted: #64748b;
      --border: #e4e1e7;
      --accent: #227a6c;
      --accent-secondary: #ffbf00;
      --accent-secondary-dark: #cc9900;
      
      --glass-bg: rgba(255, 255, 255, 0.55);
      --glass-bg-elevated: rgba(255, 255, 255, 0.75);
      --glass-border: rgba(255, 255, 255, 0.65);
      --glass-shadow: 0 8px 32px 0 rgba(34, 122, 108, 0.04);
      --glass-shadow-hover: 0 12px 40px 0 rgba(34, 122, 108, 0.08);
      --glass-blur: blur(24px) saturate(180%);

      /* Chart Design Tokens */
      --chart-primary: var(--accent);
      --chart-primary-glow: rgba(34, 122, 108, 0.15);
      --chart-secondary: var(--accent-secondary);
      --chart-secondary-glow: rgba(255, 191, 0, 0.15);
      --chart-tertiary: #52c41a;
      --chart-tertiary-glow: rgba(82, 196, 26, 0.15);
      --chart-bg: rgba(228, 225, 231, 0.35);
      --chart-grid: rgba(228, 225, 231, 0.6);
      --chart-text: var(--muted);
      --chart-bar-radius: 4px;
    }

    .theme-dark {
      --bg: #0c0a0f;
      --surface: #141217;
      --foreground: #f4f2f7;
      --muted: #8c8896;
      --border: #2c2833;
      --accent: #33a190;
      --accent-secondary: #ffc824;
      --accent-secondary-dark: #ffd44d;
      
      --glass-bg: rgba(20, 18, 23, 0.65);
      --glass-bg-elevated: rgba(30, 27, 35, 0.8);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      --glass-shadow-hover: 0 12px 40px 0 rgba(0, 0, 0, 0.45);
      --glass-blur: blur(24px) saturate(180%);

      /* Chart Design Tokens */
      --chart-primary: var(--accent);
      --chart-primary-glow: rgba(51, 161, 144, 0.25);
      --chart-secondary: var(--accent-secondary);
      --chart-secondary-glow: rgba(255, 200, 36, 0.25);
      --chart-tertiary: #64b537;
      --chart-tertiary-glow: rgba(100, 181, 55, 0.25);
      --chart-bg: rgba(44, 40, 51, 0.4);
      --chart-grid: rgba(44, 40, 51, 0.65);
      --chart-text: var(--muted);
      --chart-bar-radius: 4px;
    }

    .theme-dim {
      --bg: #121820;
      --surface: #1a222d;
      --foreground: #e2e8f0;
      --muted: #8895a5;
      --border: #2b3544;
      --accent: #2e9f8f;
      --accent-secondary: #ffbf00;
      --accent-secondary-dark: #cc9900;
      
      --glass-bg: rgba(26, 34, 45, 0.7);
      --glass-bg-elevated: rgba(36, 47, 62, 0.85);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.25);
      --glass-shadow-hover: 0 12px 40px 0 rgba(0, 0, 0, 0.38);
      --glass-blur: blur(24px) saturate(180%);

      /* Chart Design Tokens */
      --chart-primary: var(--accent);
      --chart-primary-glow: rgba(46, 159, 143, 0.25);
      --chart-secondary: var(--accent-secondary);
      --chart-secondary-glow: rgba(255, 191, 0, 0.25);
      --chart-tertiary: #52c41a;
      --chart-tertiary-glow: rgba(82, 196, 26, 0.25);
      --chart-bg: rgba(43, 53, 68, 0.45);
      --chart-grid: rgba(43, 53, 68, 0.65);
      --chart-text: var(--muted);
      --chart-bar-radius: 4px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--foreground);
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.4s, color 0.4s;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: 'Manrope', sans-serif;
      color: var(--foreground);
    }

    /* Glassmorphic Components */
    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      transition: border-color 0.3s, box-shadow 0.3s, transform 0.3s, background-color 0.3s;
    }

    .glass-panel:hover {
      box-shadow: var(--glass-shadow-hover);
    }

    .glass-panel-elevated {
      background: var(--glass-bg-elevated);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: var(--glass-shadow-hover);
    }

    /* Modern Glassmorphic Buttons utilizing color-mix() and Liquid Glass filter */
    .btn-glass {
      background: color-mix(in srgb, var(--foreground) 5%, transparent);
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      border: 1px solid color-mix(in srgb, var(--foreground) 12%, transparent);
      color: var(--foreground);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 9999px;
    }

    .btn-glass:hover {
      background: color-mix(in srgb, var(--foreground) 10%, transparent);
      border-color: color-mix(in srgb, var(--foreground) 25%, transparent);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
      transform: translateY(-1.5px);
    }

    .btn-glass:active {
      transform: translateY(0.5px);
      background: color-mix(in srgb, var(--foreground) 3%, transparent);
    }

    .btn-glass-primary {
      background: color-mix(in srgb, var(--accent) 10%, transparent);
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
      color: var(--accent);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 9999px;
    }

    .btn-glass-primary:hover {
      background: color-mix(in srgb, var(--accent) 18%, transparent);
      border-color: color-mix(in srgb, var(--accent) 40%, transparent);
      box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 12%, transparent);
      transform: translateY(-1.5px);
    }

    .btn-glass-primary:active {
      transform: translateY(0.5px);
      background: color-mix(in srgb, var(--accent) 5%, transparent);
    }

    .btn-glass-secondary {
      background: color-mix(in srgb, var(--muted) 6%, transparent);
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      border: 1px solid color-mix(in srgb, var(--muted) 15%, transparent);
      color: var(--muted);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 9999px;
    }

    .btn-glass-secondary:hover {
      background: color-mix(in srgb, var(--muted) 12%, transparent);
      border-color: color-mix(in srgb, var(--muted) 25%, transparent);
      color: var(--foreground);
      transform: translateY(-1.5px);
    }

    .btn-glass-gold {
      background: color-mix(in srgb, var(--accent-secondary) 8%, transparent);
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      border: 1px solid color-mix(in srgb, var(--accent-secondary) 20%, transparent);
      color: var(--accent-secondary-dark);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 9999px;
    }

    .btn-glass-gold:hover {
      background: color-mix(in srgb, var(--accent-secondary) 15%, transparent);
      border-color: color-mix(in srgb, var(--accent-secondary) 35%, transparent);
      transform: translateY(-1.5px);
    }

    .btn-glass-danger {
      background: rgba(239, 68, 68, 0.08);
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #ef4444;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 9999px;
    }

    .btn-glass-danger:hover {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.35);
      transform: translateY(-1.5px);
    }

    .btn-solid-teal {
      background: var(--accent);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 16px color-mix(in srgb, var(--accent) 25%, transparent);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 9999px;
    }

    .btn-solid-teal:hover {
      background: color-mix(in srgb, var(--accent) 85%, #000);
      box-shadow: 0 6px 20px color-mix(in srgb, var(--accent) 35%, transparent);
      transform: translateY(-1.5px);
    }

    .btn-solid-teal:active {
      transform: translateY(0.5px);
    }

    /* Device Simulator styling */
    .iphone-shell {
      width: 325px;
      height: 660px;
      border-radius: 46px;
      background: #18161b;
      padding: 11px;
      box-shadow: 
        0 25px 50px -12px rgba(0,0,0,0.4),
        inset 0 0 2px 2px rgba(255,255,255,0.1),
        0 0 0 4px #2c2930;
      position: relative;
      user-select: none;
    }

    .iphone-screen {
      width: 100%;
      height: 100%;
      border-radius: 36px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      transition: background-color 0.4s;
    }

    .iphone-status-bar {
      height: 38px;
      padding: 0 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--foreground);
      position: relative;
      z-index: 40;
    }

    .iphone-dynamic-island {
      position: absolute;
      top: 9px;
      left: 50%;
      transform: translateX(-50%);
      width: 84px;
      height: 19px;
      background: #000;
      border-radius: 20px;
      z-index: 50;
      box-shadow: inset 0 0 1px 1px rgba(255,255,255,0.05);
    }

    .iphone-home-indicator {
      position: absolute;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 115px;
      height: 4px;
      background: color-mix(in srgb, var(--foreground) 30%, transparent);
      border-radius: 10px;
      z-index: 40;
      pointer-events: none;
    }

    .iphone-scrollable {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px 24px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scrollbar-width: none;
    }

    .iphone-scrollable::-webkit-scrollbar {
      display: none;
    }

    /* Phone specific Bottom Navbar */
    .phone-navbar {
      height: 64px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: color-mix(in srgb, var(--surface) 55%, transparent);
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      border-top: 1px solid color-mix(in srgb, var(--accent) 15%, var(--border));
      /* NO padding-bottom here — it was breaking vertical alignment of the indicator */
      padding-bottom: 0;
      position: relative;
      z-index: 30;
      box-shadow: inset 0 1px 0 color-mix(in srgb, var(--surface) 80%, transparent);
    }

    /* ---------- Liquid glass sliding indicator — positioned via JS ----------
       The pill is a single absolute div. JS reads each button's icon element's
       getBoundingClientRect() and sets left/top/width/height inline so the
       circle always sits flush behind the SVG icon regardless of label or padding.
    -------------------------------------------------------------------------- */
    .nav-sliding-indicator {
      position: absolute;
      /* Initial geometry — JS overrides these every render */
      top: 6px;
      left: 0;
      width: 44px;
      height: 44px;
      border-radius: 30px; /* Horizontally oval/capsule shape */
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
      filter: url(#switcher);
      box-shadow: inset 0 1px 0 color-mix(in srgb, var(--surface) 30%, transparent),
                  0 4px 12px color-mix(in srgb, var(--accent) 14%, transparent);
      pointer-events: none;
      z-index: 0;
      transition: left 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                  top  0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                  width  0.3s ease,
                  height 0.3s ease;
    }

    .phone-nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--muted);
      font-size: 0.6rem;
      font-weight: 600;
      /* Safe area: 8px top, 8px bottom for label breathing room */
      padding: 8px 0;
      transition: color 0.3s ease, transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
      flex: 1;
      height: 100%;
      position: relative;
      z-index: 1;
      cursor: pointer;
      /* Remove native button chrome */
      background: none;
      border: none;
      outline: none;
    }

    .phone-nav-btn:hover:not(.active) {
      color: var(--foreground);
    }

    .phone-nav-btn:hover:not(.active) .nav-icon {
      transform: scale(1.05);
    }

    .phone-nav-btn.active {
      color: var(--accent);
    }

    .phone-nav-btn:active {
      transform: scale(0.92);
    }

    /* Icon wrapper — the element JS uses to measure position */
    .nav-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
      /* This is the anchor element the pill tracks */
      position: relative;
      z-index: 2;
    }

    .phone-nav-btn.active .nav-icon {
      transform: scale(1.08);
    }

    /* Segments Control Slider Styles */
    .switcher {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 9999px;
      padding: 3px;
      background: color-mix(in srgb, var(--foreground) 4%, transparent);
      gap: 2px;
      position: relative;
      margin: 0;
      filter: url(#switcher);
    }

    .switcher__legend {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    .switcher__option {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 9999px;
      cursor: pointer;
      position: relative;
      z-index: 10;
    }

    .switcher__input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .switcher__icon {
      width: 16px;
      height: 16px;
      --c: var(--muted);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), fill 0.3s;
    }

    .switcher__option:hover .switcher__icon {
      --c: var(--foreground);
    }

    .switcher__input:checked + .switcher__icon {
      --c: var(--accent);
      transform: scale(1.1);
    }

    .switcher__filter {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 28px;
      height: 28px;
      border-radius: 9999px;
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
      z-index: 1;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
    }

    .switcher__filter svg {
      width: 0;
      height: 0;
      position: absolute;
      pointer-events: none;
    }

    .switcher[data-previous="1"] .switcher__filter {
      transform: translateX(0);
    }
    .switcher[data-previous="2"] .switcher__filter {
      transform: translateX(30px);
    }
    .switcher[data-previous="3"] .switcher__filter {
      transform: translateX(60px);
    }

    /* Animation and layout helper classes */
    @keyframes signal-ping {
      0% { transform: scale(0.8); opacity: 0.8; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    .ping-circle {
      animation: signal-ping 1.8s infinite cubic-bezier(0.1, 0, 0.2, 1);
    }

    .toast-popup {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 12px 20px;
      border-radius: 12px;
      background: color-mix(in srgb, var(--foreground) 94%, transparent);
      border: 1px solid color-mix(in srgb, var(--foreground) 10%, transparent);
      color: var(--surface);
      font-size: 0.8rem;
      font-weight: 600;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 8px;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(10px);
    }
    
    .toast-popup.visible {
      transform: translateY(0);
      opacity: 1;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-4px); }
      40%, 80% { transform: translateX(4px); }
    }
    .animate-shake {
      animation: shake 0.4s ease-in-out;
    }

    @keyframes scaleUp {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .animate-scaleUp {
      animation: scaleUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* ---------- Emil Kowalski Micro-animations ---------- */
    @keyframes fadeInUp {
      from {
        transform: translateY(8px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
    .animate-fadeInUp {
      animation: fadeInUp 0.22s cubic-bezier(0.2, 0, 0, 1) forwards;
    }

    @keyframes bellShake {
      0%, 100% { transform: rotate(0); }
      15% { transform: rotate(-14deg); }
      30% { transform: rotate(11deg); }
      45% { transform: rotate(-9deg); }
      60% { transform: rotate(6deg); }
      75% { transform: rotate(-3deg); }
    }
    .animate-bellShake {
      animation: bellShake 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes rewardPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); color: var(--accent-secondary-dark); }
    }
    .animate-rewardPulse {
      animation: rewardPulse 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popIn {
      0% { transform: scale(0.88); opacity: 0; }
      60% { transform: scale(1.04); }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-popIn {
      animation: popIn 0.32s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    /* Interactive Card Transitions */
    .interactive-card {
      transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1), border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
    }
    .interactive-card:hover {
      transform: translateY(-2px);
      border-color: color-mix(in srgb, var(--accent) 32%, var(--border));
      box-shadow: var(--glass-shadow-hover);
    }
    .interactive-card:active {
      transform: translateY(0) scale(0.985);
    }

    /* Role Switcher Sliding Pill style */
    .role-navbar {
      position: relative;
    }
    
    .role-sliding-indicator {
      position: absolute;
      top: 6px;
      left: 6px;
      height: 28px;
      width: 76px;
      z-index: 0;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);

    // 2. NotificationBell Component (With animations and active unread badges)
    function NotificationBell({ count, onClick }) {
      const isFirstMount = React.useRef(true);
      const [shake, setShake] = React.useState(false);

      React.useEffect(() => {
        if (isFirstMount.current) {
          isFirstMount.current = false;
          return;
        }
        if (count > 0) {
          setShake(true);
          const timer = setTimeout(() => setShake(false), 600);
          return () => clearTimeout(timer);
        }
      }, [count]);

      return (
        <button 
          onClick={onClick}
          className={`p-2 rounded-xl bg-white bg-opacity-40 border border-brandBorder relative hover:bg-opacity-80 active:scale-95 transition-all ${shake ? 'animate-bellShake' : ''}`}
          title="System Alerts"
        >
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" strokeWidth="2.2">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.73 21a2 2 0 0 1-3.46 0" />
          </svg>
          {count > 0 && (
            <span className="absolute top-1 right-1 w-2.5 h-2.5 bg-brandAccent rounded-full border border-brandSurface animate-pulse"></span>
          )}
        </button>
      );
    }

    // 3. BlockchainBadge Component (Resolves color-mix values dynamically for verified / pending states)
    function BlockchainBadge({ status, tx, onClick }) {
      const getStyles = () => {
        switch (status) {
          case 'verified':
            return {
              color: 'var(--accent)',
              bg: 'color-mix(in srgb, var(--accent) 8%, transparent)',
              border: 'color-mix(in srgb, var(--accent) 25%, transparent)',
              text: 'Verified',
              icon: <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3.5" className="mr-1"><polyline points="20 6 9 17 4 12"/></svg>
            };
          case 'pending':
            return {
              color: 'var(--accent-secondary-dark)',
              bg: 'color-mix(in srgb, var(--accent-secondary) 10%, transparent)',
              border: 'color-mix(in srgb, var(--accent-secondary) 25%, transparent)',
              text: 'Pending',
              icon: <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" className="mr-1 animate-spin"><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/></svg>
            };
          default:
            return {
              color: '#ef4444',
              bg: 'color-mix(in srgb, #ef4444 10%, transparent)',
              border: 'color-mix(in srgb, #ef4444 25%, transparent)',
              text: 'Failed',
              icon: <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3.5" className="mr-1"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            };
        }
      };

      const meta = getStyles();

      return (
        <span 
          onClick={(e) => { e.stopPropagation(); if (tx && onClick) onClick(tx); }}
          className={`inline-flex items-center px-2 py-0.5 rounded-full text-[0.65rem] font-bold border transition-colors duration-200 cursor-pointer hover:bg-opacity-20 select-none ${status === 'verified' ? 'animate-popIn' : ''}`}
          style={{ color: meta.color, backgroundColor: meta.bg, borderColor: meta.border }}
        >
          {meta.icon}
          {meta.text}
        </span>
      );
    }

    // 4. CollectionCard Component (Presents collected volume stats, TPM, and blockchain verified ledger row)
    function CollectionCard({ item, onTxClick }) {
      const getGradeBadge = (grade) => {
        let style = { bg: 'color-mix(in srgb, var(--accent) 10%, transparent)', color: 'var(--accent)', text: 'Premium (SAF)' };
        if (grade === 'Standard') {
          style = { bg: 'color-mix(in srgb, var(--accent-secondary) 10%, transparent)', color: 'var(--accent-secondary-dark)', text: 'Standard' };
        } else if (grade === 'Low') {
          style = { bg: 'color-mix(in srgb, #ef4444 10%, transparent)', color: '#ef4444', text: 'Low Grade' };
        }
        return (
          <span className="text-[0.65rem] font-semibold px-2 py-0.5 rounded" style={{ backgroundColor: style.bg, color: style.color }}>
            {style.text}
          </span>
        );
      };

      return (
        <div className="glass-panel interactive-card p-3.5 rounded-2xl flex flex-col gap-2.5 border border-white border-opacity-40">
          <div className="flex justify-between items-center">
            <span className="text-[0.68rem] font-bold text-brandMuted">{item.date}</span>
            {getGradeBadge(item.grade)}
          </div>
          
          <div className="flex justify-between items-end my-0.5">
            <div>
              <div className="text-[0.62rem] text-brandMuted uppercase tracking-wider font-bold">Collected Volume</div>
              <div className="text-base font-extrabold font-display text-brandAccent">{item.volume.toFixed(1)} Liters</div>
            </div>
            <div className="text-right">
              <div className="text-[0.62rem] text-brandMuted uppercase tracking-wider font-bold">TPM Reading</div>
              <div className="text-base font-extrabold font-display text-brandFg">{item.tpm.toFixed(1)}%</div>
            </div>
          </div>

          <div className="flex justify-between items-center pt-2.5 border-t border-brandBorder border-opacity-40">

    // 7. MapViewRoute Component (Visual SVG layout sequence illustrating driver stops and fleet navigation updates)
    function MapViewRoute({ stops, activeStopIndex, onStopClick, isNavigating, progress }) {
      const locations = [
        { x: 50, y: 130, name: "Aling Maria's", label: "Stop 1" },
        { x: 170, y: 70, name: "Kuya Bob's", label: "Stop 2" },
        { x: 230, y: 140, name: "Jolli-Kalan", label: "Stop 3" }
      ];

      const depot = { x: 30, y: 40 };

      // Calculate path markers
      let tx = depot.x;
      let ty = depot.y;
      
      if (isNavigating) {
        if (progress <= 33.3) {
          const ratio = progress / 33.3;
          tx = depot.x + ratio * (locations[0].x - depot.x);
          ty = depot.y + ratio * (locations[0].y - depot.y);
        } else if (progress <= 66.6) {
          const ratio = (progress - 33.3) / 33.3;
          tx = locations[0].x + ratio * (locations[1].x - locations[0].x);
          ty = locations[0].y + ratio * (locations[1].y - locations[0].y);
        } else {
          const ratio = (progress - 66.6) / 33.4;
          tx = locations[1].x + ratio * (locations[2].x - locations[1].x);
          ty = locations[1].y + ratio * (locations[2].y - locations[1].y);
        }
      } else if (activeStopIndex !== null) {
        tx = locations[activeStopIndex].x;
        ty = locations[activeStopIndex].y;
      }

      return (
        <div className="relative w-full h-[180px] rounded-2xl overflow-hidden bg-brandBg border border-brandBorder border-opacity-40">
          
          <svg width="100%" height="100%" viewBox="0 0 280 180" className="absolute inset-0 z-10">
            {/* Simulated streets */}
            <line x1="0" y1="40" x2="280" y2="40" stroke="var(--border)" strokeWidth="3" opacity="0.5" />
            <line x1="50" y1="0" x2="50" y2="180" stroke="var(--border)" strokeWidth="3" opacity="0.5" />
            <line x1="170" y1="0" x2="170" y2="180" stroke="var(--border)" strokeWidth="3" opacity="0.5" />
            <line x1="0" y1="130" x2="280" y2="130" stroke="var(--border)" strokeWidth="3" opacity="0.5" />

            {/* Simulated routing paths */}
            <path 
              d={`M ${depot.x} ${depot.y} L ${locations[0].x} ${locations[0].y} L ${locations[1].x} ${locations[1].y} L ${locations[2].x} ${locations[2].y}`} 
              fill="none" 
              stroke="var(--accent)" 
              strokeWidth="2.5" 
              strokeDasharray="5,3" 
              opacity="0.85" 
            />

            {/* Depot terminal */}
            <circle cx={depot.x} cy={depot.y} r="5" fill="var(--muted)" />
            <circle cx={depot.x} cy={depot.y} r="9" fill="none" stroke="var(--muted)" strokeWidth="1" opacity="0.4" />
            <text x={depot.x - 10} y={depot.y - 10} fontSize="7" fontWeight="800" fill="var(--muted)">DEPOT</text>

            {/* Locations sequence */}
            {locations.map((loc, i) => {
              const stop = stops[i];
              const isCompleted = stop.status === 'completed';
              const isActive = activeStopIndex === i;
              
              let markerColor = 'var(--accent-secondary)';
              if (isCompleted) markerColor = 'var(--accent)';
              else if (isActive) markerColor = '#3b82f6';

              return (
                <g key={loc.label} className="cursor-pointer" onClick={() => onStopClick(i)}>
                  <line x1={loc.x} y1={loc.y} x2={loc.x} y2={loc.y - 10} stroke={markerColor} strokeWidth="1.5" />
                  <circle cx={loc.x} cy={loc.y - 10} r="7" fill={markerColor} />
                  {isActive && !isCompleted && (
                    <circle cx={loc.x} cy={loc.y - 10} r="11" fill="none" stroke={markerColor} strokeWidth="1" className="ping-circle" />
                  )}
                  <text x={loc.x} y={loc.y - 7.5} fontSize="7" fontWeight="bold" fill={isCompleted ? "white" : "#09090b"} textAnchor="middle">{i + 1}</text>
                  <text x={loc.x} y={loc.y + 10} fontSize="7" fontWeight="700" fill="var(--foreground)" textAnchor="middle">
                    {loc.name.split(" ")[0]}
                  </text>
                </g>
              );
            })}

            {/* Vehicle indicator */}
            <g transform={`translate(${tx - 6}, ${ty - 12})`} className="transition-transform duration-300">
              <rect width="12" height="8" rx="1.5" fill="var(--foreground)" />
              <rect x="8" y="1" width="3" height="6" fill="var(--surface)" />
              <circle cx="3" cy="8" r="2" fill="var(--muted)" />
              <circle cx="9" cy="8" r="2" fill="var(--muted)" />
              {isNavigating && (
                <circle cx="6" cy="-2" r="3" fill="none" stroke="var(--accent)" strokeWidth="1" className="ping-circle" />
              )}
            </g>
          </svg>
        </div>
      );
    }

    // 8. AuthScreen Component (Login OTP layout)
    function AuthScreen({ onLoginSuccess, isOnline, triggerToast }) {
      const [phone, setPhone] = useState('');
      const [otpSent, setOtpSent] = useState(false);
      const [otp, setOtp] = useState('');
      const [error, setError] = useState('');
      const [timer, setTimer] = useState(0);

      useEffect(() => {
        let interval = null;
        if (timer > 0) {
          interval = setInterval(() => {
            setTimer(prev => prev - 1);
          }, 1000);
        } else {
          clearInterval(interval);
        }
        return () => clearInterval(interval);
      }, [timer]);

      const handleSendOTP = (e) => {
        e.preventDefault();
        if (phone.length < 10) {
          setError('Please enter a valid phone number.');
          return;
        }
        if (!isOnline) {
          triggerToast("Offline! Cannot register OTP.");
          return;
        }
        setError('');
        setOtpSent(true);
        setTimer(60);
        triggerToast("One-time passcode sent successfully.");
      };

      const handleVerify = (e) => {
        e.preventDefault();
        if (otp === '123456' || otp.length === 6) {
          onLoginSuccess();
          triggerToast("Authorized successfully!");
        } else {
          setError('Incorrect passcode. Try "123456" for demo.');
        }
      };

      return (
        <div className="flex flex-col gap-4 py-4 px-2">
          <div className="text-center mb-2">
            <div className="inline-flex p-3 rounded-2xl bg-brandAccent bg-opacity-10 text-brandAccent border border-brandAccent border-opacity-15 mb-3">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            </div>
            <h2 className="text-sm font-extrabold font-display text-brandFg">Verification</h2>
            <p className="text-[0.7rem] text-brandMuted mt-1">Provide credentials to trace collection ledgers.</p>
          </div>

          {error && (
            <div className="p-2.5 rounded-xl bg-red-500 bg-opacity-10 border border-red-500 border-opacity-25 text-red-600 text-xs font-semibold text-center animate-shake">
              {error}
            </div>
          )}

          {!otpSent ? (
            <form onSubmit={handleSendOTP} className="flex flex-col gap-3">
              <div className="flex flex-col gap-1.5">
                <label className="text-[0.62rem] font-bold text-brandMuted uppercase tracking-wider">Mobile Number</label>
                <div className="relative">
                  <span className="absolute left-3 top-1/2 -translate-y-1/2 text-xs font-bold text-brandMuted">+63</span>
                  <input 
                    type="tel"
                    placeholder="917 123 4567"
                    value={phone}
                    onChange={(e) => setPhone(e.target.value.replace(/\D/g, ''))}
                    className="w-full pl-10 pr-4 py-2 bg-brandSurface bg-opacity-60 border border-brandBorder rounded-xl text-xs font-bold focus:outline-none focus:border-brandAccent transition-all text-brandFg"
                  />
                </div>
              </div>
              <button 
                type="submit" 
                className="w-full py-2.5 rounded-xl btn-solid-teal text-xs font-bold transition-all mt-1"
              >
                Send One-Time Passcode
              </button>
            </form>
          ) : (
            <form onSubmit={handleVerify} className="flex flex-col gap-3">
              <div className="flex flex-col gap-1.5">
                <div className="flex justify-between items-center">
                  <label className="text-[0.62rem] font-bold text-brandMuted uppercase tracking-wider">6-Digit Code</label>
                  <span className="text-[0.62rem] text-brandAccent font-bold">Sent to +63 {phone}</span>
                </div>
                <input 
                  type="text"
                  maxLength={6}
                  placeholder="Enter 6-digit code"
                  value={otp}
                  onChange={(e) => setOtp(e.target.value.replace(/\D/g, ''))}
                  className="w-full px-4 py-2 bg-brandSurface bg-opacity-60 border border-brandBorder rounded-xl text-xs font-bold tracking-widest text-center focus:outline-none focus:border-brandAccent transition-all text-brandFg"
                />
              </div>
              <button 
                type="submit" 
                className="w-full py-2.5 rounded-xl btn-solid-teal text-xs font-bold transition-all mt-1"
              >
                Verify & Continue
              </button>
              <div className="text-center mt-1">
                <button 
                  type="button"
                  disabled={timer > 0}
                  onClick={() => setTimer(60)}
                  className={`text-[0.65rem] font-bold ${timer > 0 ? 'text-brandMuted cursor-default' : 'text-brandAccent hover:underline'}`}
                >
                  {timer > 0 ? `Resend OTP in ${timer}s` : 'Resend OTP'}
                </button>
              </div>
            </form>
          )}
        </div>
      );
    }

    // 9. PhoneBottomNav component — glass nav with liquid-glass active indicator
    function PhoneBottomNav({ activeTab, onTabChange, role }) {
      const getTabs = () => {
        if (role === 'consumer') {
          return [
            { id: 'dashboard', label: 'Home',    icon: NAV_ICONS.home },
            { id: 'request',   label: 'Pickup',  icon: NAV_ICONS.pickup },
            { id: 'history',   label: 'History', icon: NAV_ICONS.history },
            { id: 'points',    label: 'Points',  icon: NAV_ICONS.points }
          ];
        }
        if (role === 'driver') {
          return [
            { id: 'route',   label: 'Route',  icon: NAV_ICONS.route },
            { id: 'record',  label: 'Record', icon: NAV_ICONS.record },
            { id: 'history', label: 'Log',    icon: NAV_ICONS.log }
          ];
        }
        return [
          { id: 'dashboard', label: 'Analytics', icon: NAV_ICONS.analytics },
          { id: 'map',       label: 'Fleet Map',  icon: NAV_ICONS.fleetMap },
          { id: 'ledger',    label: 'Ledger',     icon: NAV_ICONS.ledger }
        ];
      };

      const tabs = getTabs();
      const activeIdx = tabs.findIndex(t => t.id === activeTab);

      const navRef = React.useRef(null);
      const indicatorRef = React.useRef(null);
      const btnRefs = React.useRef([]);

      // Position the pill directly over the icon of the active button
      const positionIndicator = React.useCallback(() => {
        const navbar = navRef.current;
        const indicator = indicatorRef.current;
        if (!navbar || !indicator) return;
        const idx = activeIdx >= 0 ? activeIdx : 0;
        const btn = btnRefs.current[idx];
        if (!btn) return;
        const navRect = navbar.getBoundingClientRect();
        const btnRect = btn.getBoundingClientRect();
        
        // Size the oval to cover both icon and label nicely
        const PILL_WIDTH = btnRect.width * 0.85; 
        const PILL_HEIGHT = btnRect.height * 0.85; 
        
        // Center relative to the entire button
        const cx = btnRect.left - navRect.left + btnRect.width / 2;
        const cy = btnRect.top  - navRect.top  + btnRect.height / 2;
        
        indicator.style.left   = (cx - PILL_WIDTH / 2) + 'px';
        indicator.style.top    = (cy - PILL_HEIGHT / 2) + 'px';
        indicator.style.width  = PILL_WIDTH + 'px';
        indicator.style.height = PILL_HEIGHT + 'px';
      }, [activeIdx]);

      React.useLayoutEffect(() => {
        positionIndicator();
      }, [positionIndicator]);

      return (
        <div ref={navRef} className="phone-navbar">
          {/* Liquid glass indicator — JS-positioned over icon center */}
          <div ref={indicatorRef} className="nav-sliding-indicator" />
          {tabs.map((tab, i) => (
            <button
              key={tab.id}
              ref={el => btnRefs.current[i] = el}
              onClick={() => onTabChange(tab.id)}
              className={`phone-nav-btn ${activeTab === tab.id ? 'active' : ''}`}
            >
              <span className="nav-icon">{tab.icon}</span>
              <span>{tab.label}</span>
            </button>
          ))}
        </div>
      );
    }

                  >
                    <span className="nav-icon">{NAV_ICONS[group.icons[i]]}</span>
                    <span>{tab.label}</span>
                  </button>
                ))}
              </div>
            );
          })()}
        </div>
      );
    }

    function App() {

      // Telemetry variables
      const [simTpm, setSimTpm] = useState(21.4);
      const [simVolume, setSimVolume] = useState(5.0);

      // Playground Customizer State
      const [custBlur, setCustBlur] = useState(24);
      const [custBgOpacity, setCustBgOpacity] = useState(55);
      const [custBorderOpacity, setCustBorderOpacity] = useState(65);
      const [custTheme, setCustTheme] = useState('teal'); 

      const triggerToast = (msg) => {
        setToast(msg);
        setToastVisible(true);
        setTimeout(() => setToastVisible(false), 2500);
      };

      const handleRoleChange = (newRole) => {
        setRole(newRole);
        if (newRole === 'consumer') setActiveTab('dashboard');
        else if (newRole === 'driver') setActiveTab('route');
        else setActiveTab('dashboard');
      };

      // Watch global theme change and apply to document body
      useEffect(() => {
        document.body.className = `p-0 m-0 min-h-screen flex flex-col theme-${theme}`;
      }, [theme]);

      // Simulate vehicle progress navigation
      useEffect(() => {
        let timer = null;
        if (isNavigating) {
          timer = setInterval(() => {
            setNavProgress(prev => {
              if (prev >= 100) {
                setIsNavigating(false);
                triggerToast("Route navigation completed!");
                return 100;
              }
              if (prev < 33.3 && prev + 2 >= 33.3) setActiveRouteStop(1);
              if (prev < 66.6 && prev + 2 >= 66.6) setActiveRouteStop(2);
              return prev + 2;
            });
          }, 100);
        }
        return () => clearInterval(timer);
      }, [isNavigating]);

      // Add collection requests
      const handleAddRequest = (newReq) => {
        if (!isOnline) {
          triggerToast("Writes disabled. Connect to the internet.");
          return;
        }
        setRequests(prev => [newReq, ...prev]);
        triggerToast("Pickup request successfully sent!");

          id: Date.now(),
          title: 'Pickup Scheduled 📩',
          desc: `Requested collection for ${newReq.date}.`,
          read: false,
          time: 'Just now'
        }, ...prev]);
        setShowNotifIndicator(true);
      };

      const handleRecordCollection = (record) => {
        if (!isOnline) {
          triggerToast("Offline! Cannot record collection.");
          return;
        }

          date: 'Today',
          volume: record.volume,
          tpm: record.tpm,
          grade: record.grade,
          status: 'verified',
          tx: '0x' + Array.from({length: 40}, () => Math.floor(Math.random()*16).toString(16)).join(''),
          consumer: record.consumer,
          address: record.address
        };

        setCollections(prev => [newCol, ...prev]);
        setPoints(prev => prev + Math.round(record.volume * 10));

        setDriverRoute(prev => prev.map(stop => 
          stop.name === record.consumer ? { ...stop, status: 'completed' } : stop
        ));

        triggerToast(`On-chain transaction submitted! Vol: ${record.volume}L`);

        setNotifications(prev => [{
          id: Date.now(),
          title: 'Oil Trace logged! 🎉',
          desc: `${record.volume}L recorded from ${record.consumer}.`,
          read: false,
          time: 'Just now'
        }, ...prev]);
        setShowNotifIndicator(true);
        setActiveTab('route');
      };

                                        <div className="text-[0.7rem] font-bold text-brandFg">No Active Vouchers</div>
                                        <div className="text-[0.6rem] text-brandMuted">Redeem points to get discount codes here.</div>

                                    )}
                                  </div>
                                </div>
                              </div>
                            </div>
                          )}
                        </div>
                      )}

                      {/* DRIVER ROLE VIEW CONTROLLERS */}
                      {role === 'driver' && (
                        <div className="flex flex-col gap-3">

                            <>
                              <div className="flex justify-between items-center mt-0.5">
                                <div>
                                  <div className="text-[0.62rem] text-brandMuted font-bold uppercase tracking-wider">Driver Dispatch Route</div>

                                </div>
                                <span className="text-[0.6rem] font-bold text-[#227a6c] bg-brandAccent bg-opacity-10 px-2 py-0.5 rounded border border-brandAccent border-opacity-15">
                                  3 Stops
                                </span>
                              </div>

                              <MapViewRoute 
                                stops={driverRoute} 
                                activeStopIndex={activeRouteStop} 
                                onStopClick={(idx) => {
                                  setActiveRouteStop(idx);
                                  triggerToast(`Destination focused on stop ${idx+1}.`);
                                }} 
                                isNavigating={isNavigating} 
                                progress={navProgress} 
                              />

                              <div className="flex gap-2">
                                <button 
                                  onClick={() => {
                                    setIsNavigating(true);
                                    setNavProgress(0);
                                    triggerToast("Simulating route GPS broadcasts...");
                                  }}
                                  disabled={isNavigating}
                                  className="flex-1 py-2 rounded-xl btn-solid-teal text-xs font-bold"
                                >
                                  {isNavigating ? 'Navigating stops...' : 'Start Dispatch Route'}
                                </button>
                              </div>

                              <div className="flex flex-col gap-2">
                                <div className="text-[0.65rem] font-bold text-brandMuted uppercase tracking-wider">Collection Stops</div>

                                  <div 
                                    key={stop.id}
                                    onClick={() => setActiveRouteStop(idx)}
                                    className={`glass-panel p-3 rounded-xl flex justify-between items-center border border-white border-opacity-40 cursor-pointer ${activeRouteStop === idx ? 'bg-brandSurface bg-opacity-80 border-brandAccent' : ''}`}
                                  >
                                    <div className="flex items-center gap-2.5">
                                      <span className={`w-5 h-5 rounded-full flex items-center justify-center text-[0.65rem] font-bold ${

                                          ? 'bg-brandAccent text-white' 
                                          : activeRouteStop === idx ? 'bg-blue-500 text-white' : 'bg-brandBorder text-brandMuted'
                                      }`}>
                                        {stop.status === 'completed' ? '✓' : idx + 1}
                                      </span>
                                      <div>
                                        <div className="text-[0.72rem] font-extrabold text-brandFg">{stop.name}</div>
                                        <div className="text-[0.62rem] text-brandMuted">{stop.address} · ETA {stop.eta}</div>
                                      </div>
                                    </div>
                                    <span className="text-[0.65rem] font-bold text-brandMuted">{stop.dist}</span>
                                  </div>
                                ))}
                              </div>
                            </>
                          )}

                            <div className="flex flex-col gap-3.5">

                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>

                                  <div className="text-[0.62rem] font-bold text-brandMuted uppercase tracking-wider">Active Client Stop</div>
                                  <div className="text-xs font-extrabold mt-0.5 text-brandFg">{driverRoute[activeRouteStop]?.name}</div>
                                  <div className="text-[0.62rem] text-brandMuted">{driverRoute[activeRouteStop]?.address}</div>
                                </div>

                                  Stop {activeRouteStop + 1}
                                </span>
                              </div>

                                    <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-500 opacity-75"></span>

                                  </span>
                                  <div>
                                    <div className="text-[0.7rem] font-extrabold text-brandFg">OIL-ESP32-001 connected</div>
                                    <div className="text-[0.62rem] text-brandMuted">Telemetric verification system active</div>
                                  </div>
                                </div>
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" strokeWidth="2.5"><path d="M12 2a5 5 0 0 0-5 5v3a5 5 0 0 0 10 0V7a5 5 0 0 0-5-5z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
                              </div>

                              <div className="flex flex-col gap-3">

                                    onChange={(e) => setSimTpm(parseFloat(e.target.value))}
                                    className="w-full h-1 bg-brandBorder rounded-lg appearance-none cursor-pointer accent-brandAccent"
                                  />
                                </div>

                                <div className="flex flex-col gap-1">
                                  <div className="flex justify-between text-[0.65rem] font-bold text-brandMuted uppercase tracking-wider">
                                    <span>Telemetry Volume</span>
                                    <span className="font-extrabold text-brandFg">{simVolume} Liters</span>
                                  </div>
                                  <input 
                                    type="range" min="1" max="15" step="0.5" value={simVolume} 
                                    onChange={(e) => setSimVolume(parseFloat(e.target.value))}
                                    className="w-full h-1 bg-brandBorder rounded-lg appearance-none cursor-pointer accent-brandAccent"
                                  />
                                </div>

                                <button 
                                  onClick={() => handleRecordCollection({

                                    address: driverRoute[activeRouteStop].address,
                                    volume: simVolume,
                                    tpm: simTpm,
                                    grade: simTpm <= 25 ? 'Premium' : 'Standard'
                                  })}
                                  className="w-full py-2.5 rounded-xl btn-solid-teal text-xs font-bold mt-1"
                                >
                                  Sign & Upload Ledger Receipt
                                </button>
                              </div>
                            </div>
                          )}

                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" strokeWidth="1.5"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                                    <div className="text-[0.75rem] font-bold text-brandFg">No Ledgers Found</div>

                                  ))
                                )}
                              </div>
                            </div>
                          )}
                        </div>

                                      <span className="w-1.5 h-1.5 rounded-full bg-chartTertiary"></span>

                                </div>

                                  {/* Grouped Chart Bars */}
                                  <div className="absolute inset-x-0 bottom-0 top-0 flex items-end justify-between px-2.5 pb-1">

                                    {/* T */}
                                    <div className="flex items-end gap-0.5 h-full">

                                      <div className="w-2 bg-chartTertiary h-[40%] transition-all duration-300 hover:brightness-105" style={{ borderRadius: 'var(--chart-bar-radius) var(--chart-bar-radius) 0 0', boxShadow: '0 2px 6px var(--chart-tertiary-glow)' }} title="Premium: 4.0L"></div>
                                    </div>
                                    {/* W */}
                                    <div className="flex items-end gap-0.5 h-full">
                                      <div className="w-2 bg-chartPrimary h-[55%] transition-all duration-300 hover:brightness-105" style={{ borderRadius: 'var(--chart-bar-radius) var(--chart-bar-radius) 0 0', boxShadow: '0 2px 6px var(--chart-primary-glow)' }} title="Total: 5.5L"></div>
                                      <div className="w-2 bg-chartTertiary h-[35%] transition-all duration-300 hover:brightness-105" style={{ borderRadius: 'var(--chart-bar-radius) var(--chart-bar-radius) 0 0', boxShadow: '0 2px 6px var(--chart-tertiary-glow)' }} title="Premium: 3.5L"></div>
                                    </div>
                                    {/* T */}
                                    <div className="flex items-end gap-0.5 h-full">
                                      <div className="w-2 bg-chartPrimary h-[80%] transition-all duration-300 hover:brightness-105" style={{ borderRadius: 'var(--chart-bar-radius) var(--chart-bar-radius) 0 0', boxShadow: '0 2px 6px var(--chart-primary-glow)' }} title="Total: 8.0L"></div>
                                      <div className="w-2 bg-chartTertiary h-[60%] transition-all duration-300 hover:brightness-105" style={{ borderRadius: 'var(--chart-bar-radius) var(--chart-bar-radius) 0 0', boxShadow: '0 2px 6px var(--chart-tertiary-glow)' }} title="Premium: 6.0L"></div>
                                    </div>
                                    {/* F */}
                                    <div className="flex items-end gap-0.5 h-full">
                                      <div className="w-2 bg-chartPrimary h-[95%] transition-all duration-300 hover:brightness-105" style={{ borderRadius: 'var(--chart-bar-radius) var(--chart-bar-radius) 0 0', boxShadow: '0 2px 6px var(--chart-primary-glow)' }} title="Total: 9.5L"></div>
                                      <div className="w-2 bg-chartTertiary h-[80%] transition-all duration-300 hover:brightness-105" style={{ borderRadius: 'var(--chart-bar-radius) var(--chart-bar-radius) 0 0', boxShadow: '0 2px 6px var(--chart-tertiary-glow)' }} title="Premium: 8.0L"></div>
                                    </div>
                                  </div>
                                </div>
                                
                                <div className="flex justify-between text-[0.55rem] text-brandMuted font-bold px-2">
                                  <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span>
                                </div>
                              </div>

                              {/* Realtime Ledger Registry */}
                              <div className="flex flex-col gap-2">
                                <div className="text-[0.65rem] font-bold text-brandMuted uppercase tracking-wider">Real-time Blockchain Logs</div>
                                {collections.length === 0 ? (
                                  <div className="glass-panel p-4 rounded-xl flex flex-col items-center justify-center text-center gap-1.5 border border-white border-opacity-40">
                                    <div className="text-[0.65rem] font-bold text-brandMuted">No logs recorded yet.</div>
                                  </div>
                                ) : (
                                  collections.slice(0, 3).map(item => (
                                    <div key={item.id} className="glass-panel p-2 rounded-xl border border-white border-opacity-40 flex justify-between items-center text-[0.68rem]">
                                      <div className="flex items-center gap-1.5">
                                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" strokeWidth="2.5"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                                        <span className="font-bold text-brandFg">{item.volume}L · {item.consumer.split(" ")[0]}</span>
                                      </div>
                                      <BlockchainBadge status={item.status} tx={item.tx} onClick={(tx) => setModalTx(tx)} />
                                    </div>
                                  ))
                                )}
                              </div>
                            </>
                          )}

                          {activeTab === 'map' && (
                            <div className="flex flex-col gap-3">
                              <h3 className="text-xs font-extrabold text-brandFg border-b border-brandBorder border-opacity-40 pb-1.5">Fleet Map Dashboard</h3>
                              <MapViewRoute 
                                stops={driverRoute} 
                                activeStopIndex={activeRouteStop} 
                                onStopClick={(idx) => {
                                  setActiveRouteStop(idx);
                                }} 
                                isNavigating={isNavigating} 
                                progress={navProgress} 
                              />

                                <div className="font-bold text-brandFg">GPS Broadcast Channel</div>
                                <div className="flex justify-between text-[0.62rem] text-brandMuted mt-0.5">
                                  <span>Channel ID:</span>
                                  <span className="font-mono text-brandFg">driver:active:location</span>
                                </div>
                                <div className="flex justify-between text-[0.62rem] text-brandMuted">
                                  <span>Sync Frequency:</span>
                                  <span className="text-emerald-500 font-bold">10s real-time</span>
                                </div>
                              </div>
                            </div>
                          )}

                          {activeTab === 'ledger' && (
                            <div className="flex flex-col gap-3">
                              <h3 className="text-xs font-extrabold text-brandFg border-b border-brandBorder border-opacity-40 pb-1.5">Blockchain Registry</h3>
                              <div className="flex flex-col gap-2">
                                {collections.length === 0 ? (
                                  <div className="glass-panel p-4 rounded-xl flex flex-col items-center justify-center text-center gap-1.5 border border-white border-opacity-40">
                                    <div className="text-[0.65rem] font-bold text-brandMuted">No blockchain ledger entries yet.</div>
                                  </div>
                                ) : (
                                  collections.map(item => (
                                    <div key={item.id} className="glass-panel p-2.5 rounded-xl border border-white border-opacity-40 flex flex-col gap-1 text-[0.68rem]">
                                      <div className="flex justify-between items-center">
                                        <span className="font-extrabold text-brandFg">{item.consumer}</span>
                                        <span className="font-mono text-brandMuted text-[0.6rem]">{item.tx.substring(0, 10)}...</span>
                                      </div>
                                      <div className="flex justify-between text-[0.62rem] text-brandMuted mt-0.5">
                                        <span>Vol: {item.volume}L · TPM {item.tpm}%</span>
                                        <BlockchainBadge status={item.status} tx={item.tx} onClick={(tx) => setModalTx(tx)} />
                                      </div>
                                    </div>
                                  ))
                                )}
                              </div>
                            </div>
                          )}
                        </div>

                    </div>

                    <div className="iphone-home-indicator"></div>

                    {/* Bottom Navigator */}
                    <PhoneBottomNav 
                      activeTab={activeTab} 
                      onTabChange={setActiveTab} 
                      role={role} 
                    />

                  </div>
                </div>

                {/* Simulated notifications dispatcher */}
                <div className="flex gap-2.5 mt-2">
                  <button 
                    onClick={() => {
                      const id = Date.now();
                      const newNotif = {
                        id,
                        title: 'Collection verified! 📊',
                        desc: 'Receipt registered on-chain. Vouchers updated.',
                        read: false,
                        time: 'Just now'
                      };
                      setNotifications(prev => [newNotif, ...prev]);
                      setShowNotifIndicator(true);
                      triggerToast("Notification broadcast fired.");
                    }}
                    className="px-3.5 py-1.5 rounded-full bg-[#09090b] text-[#ffffff] text-[0.65rem] font-bold hover:bg-opacity-80 transition-colors"
                  >
                    Broadcast System Alert
                  </button>
                </div>

              </div>

            </div>

          {/* Etherscan details modal dialog */}
          {modalTx && (
            <div className="fixed inset-0 bg-black bg-opacity-40 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={() => setModalTx(null)}>

                <div className="flex justify-between items-center border-b border-brandBorder border-opacity-40 pb-3">
                  <h3 className="text-sm font-extrabold text-brandFg font-display">On-Chain Transaction Verification</h3>
                  <button onClick={() => setModalTx(null)} className="text-brandMuted hover:text-brandFg text-lg">&times;</button>
                </div>
                
                <div className="flex flex-col gap-3.5 text-xs">
                  <div className="flex justify-between">
                    <span className="text-brandMuted font-bold">Network Context:</span>
                    <span className="font-extrabold text-brandFg">Ethereum Mainnet (Consensus)</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-brandMuted font-bold">Validation Status:</span>
                    <span className="font-extrabold text-emerald-600 bg-emerald-500 bg-opacity-10 px-2 py-0.5 rounded border border-emerald-500 border-opacity-15">Confirmed (12 blocks)</span>

                    <span className="font-mono bg-brandBg bg-opacity-50 p-2.5 rounded break-all select-all font-bold text-brandAccent text-[0.68rem]">{modalTx}</span>
                  </div>
                </div>

                <div className="flex justify-end gap-2.5 pt-2">
                  <button onClick={() => setModalTx(null)} className="px-4 py-2 rounded-xl btn-glass text-xs font-bold">Dismiss</button>
                  <button 
                    onClick={() => {
                      triggerToast("Hash Copied to Clipboard!");
                      navigator.clipboard.writeText(modalTx);
                      setModalTx(null);
                    }} 
                    className="px-4 py-2 rounded-xl btn-solid-teal text-xs font-bold"
                  >
                    Copy Address
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* QR Voucher Code Modal Dialog */}

            <div className="fixed inset-0 bg-black bg-opacity-40 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={() => setModalQR(null)}>

                  <button onClick={() => setModalQR(null)} className="text-brandMuted hover:text-brandFg text-lg">&times;</button>

                <div className="text-center">
                  <div className="text-base font-extrabold text-brandAccent">{modalQR.merchant}</div>

                    <rect x="35" y="35" width="15" height="5" fill="black" />
                    <rect x="55" y="30" width="5" height="15" fill="black" />
                    <rect x="65" y="35" width="10" height="5" fill="black" />
                    <rect x="15" y="45" width="15" height="5" fill="black" />
                    <rect x="10" y="55" width="5" height="10" fill="black" />
                    <rect x="35" y="50" width="5" height="15" fill="black" />
                    <rect x="45" y="45" width="15" height="10" fill="black" />
                    <rect x="70" y="55" width="15" height="5" fill="black" />
                    <rect x="35" y="75" width="10" height="5" fill="black" />
                    <rect x="50" y="75" width="5" height="15" fill="black" />
                    <rect x="60" y="75" width="10" height="5" fill="black" />
                    <rect x="70" y="70" width="5" height="20" fill="black" />
                  </svg>
                </div>

                <div className="text-center w-full">
                  <div className="text-[0.62rem] text-brandMuted font-bold uppercase tracking-wider">Voucher Identification ID</div>
                  <div className="text-xs font-mono font-extrabold text-brandFg bg-brandBg bg-opacity-50 px-3 py-1.5 rounded-lg mt-1 select-all tracking-wider border border-brandBorder w-full">
                    {modalQR.id}
                  </div>
                </div>

                <div className="w-full flex gap-2">
                  <button onClick={() => setModalQR(null)} className="flex-1 py-2 rounded-xl btn-glass text-xs font-bold">Dismiss</button>
                  <button 
                    onClick={() => {
                      triggerToast("Voucher Code Copied!");
                      navigator.clipboard.writeText(modalQR.id);
                      setModalQR(null);
                    }} 
                    className="flex-1 py-2 rounded-xl btn-solid-teal text-xs font-bold"
                  >
                    Copy Voucher
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Simulated Notification alerts drawer */}
          {showNotifMenu && (
            <div className="fixed inset-0 bg-black bg-opacity-40 backdrop-blur-sm z-50 flex items-center justify-center p-4" onClick={() => setShowNotifMenu(false)}>
              <div className="glass-panel p-5 rounded-2xl max-w-sm w-full border border-white border-opacity-50 shadow-2xl flex flex-col gap-4 animate-scaleUp" onClick={(e) => e.stopPropagation()}>
                <div className="flex justify-between items-center border-b border-brandBorder border-opacity-40 pb-3">
                  <div className="flex items-center gap-2">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" strokeWidth="2.2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                    <h3 className="text-sm font-extrabold text-brandFg font-display">System Notifications</h3>
                  </div>
                  <button onClick={() => setShowNotifMenu(false)} className="text-brandMuted hover:text-brandFg text-lg">&times;</button>
                </div>

                <div className="flex flex-col gap-2.5 max-h-[240px] overflow-y-auto pr-1">
                  {notifications.length === 0 ? (
                    <div className="text-center text-xs text-brandMuted py-8">No notifications yet.</div>
                  ) : (
                    notifications.map(n => (
                      <div key={n.id} className="p-3 rounded-xl border border-brandBorder bg-brandSurface bg-opacity-50 flex flex-col gap-1">
                        <div className="flex justify-between items-center">
                          <span className="text-[0.72rem] font-extrabold text-brandFg">{n.title}</span>
                          <span className="text-[0.6rem] text-brandMuted">{n.time}</span>
                        </div>
                        <p className="text-[0.65rem] text-brandMuted leading-relaxed">{n.desc}</p>
                      </div>
                    ))
                  )}
                </div>

                <div className="flex justify-between items-center pt-2 border-t border-brandBorder border-opacity-40">
                  <button 
                    onClick={() => {
                      setNotifications([]);
                      triggerToast("Notifications ledger cleared.");
                    }}
                    className="text-[0.65rem] font-bold text-red-500 hover:underline"
                  >
                    Clear Ledger
                  </button>
                  <button onClick={() => setShowNotifMenu(false)} className="px-3.5 py-1.5 rounded-lg btn-glass text-xs font-bold">Dismiss</button>
                </div>
              </div>
            </div>
          )}

          {/* Simulated Toast Overlay */}
          <div className={`toast-popup ${toastVisible ? 'visible' : ''}`}>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
            <span>{toast}</span>
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
