name: Backend CI

on:
  push:
    paths: ["backend/**"]
  pull_request:
    branches: [main]
    paths: ["backend/**"]

env:
  OILTRACE_TEST_DB: sqlite

jobs:
  backend-unit-tests:
    name: Unit & API tests (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit & API tests
        run: >
          python -m pytest tests/ -v
          --ignore=tests/test_rls_boundaries.py
          --ignore=tests/test_integration_workflows.py
          --ignore=tests/test_integration_data_integrity.py
          --ignore=tests/test_integration_rate_limiting.py
          --ignore=tests/test_integration_concurrency.py
          --ignore=tests/test_integration_error_recovery.py
        timeout-minutes: 10

  backend-integration-tests:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install psycopg2-binary

      - name: Run integration & RLS tests
        env:
          OILTRACE_TEST_DB: postgres
          DATABASE_URL: postgresql://test:test@localhost:5432/test
        run: >
          python -m pytest tests/ -v
          -k "rls_boundaries or integration"
        timeout-minutes: 10
